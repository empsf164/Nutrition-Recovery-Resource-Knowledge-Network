<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Login — NOURIVA</title>
  <meta name="description" content="Sign in to your NOURIVA account to save resources, join community discussions, and personalize your nutrition feed.">
  <link rel="canonical" href="https://nouriva.org/login.html">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

  <!-- Floating Theme Toggle in Top Right Corner -->
  <div class="auth-floating-theme-btn">
    <button class="theme-toggle-btn shadow-sm" aria-label="Toggle light and dark mode">
      <i class="bi bi-moon-stars"></i>
    </button>
  </div>

  <!-- LOGIN SECTION (No Navbar - Brand centered inside auth card) -->
  <main class="auth-page-wrapper">
    <div class="auth-card">
      
      <!-- Brand Logo Centered Inside Box -->
      <a href="index.html" class="auth-brand-center" aria-label="Return to NOURIVA Homepage">
        <div class="brand-mark">
          <i class="bi bi-flower1"></i>
        </div>
        <span class="brand-name">NOURIVA</span>
      </a>

      <div class="auth-header text-center mb-4">
        <h2 class="font-editorial mb-1">Welcome Back</h2>
        <p class="text-secondary small mb-0">Sign in to access your saved knowledge collection and discussions.</p>
      </div>

      <!-- Quick Demo Credentials Selector -->
      <div class="p-2 mb-3 bg-subtle rounded-2 border border-subtle text-center">
        <span class="d-block text-muted" style="font-size: 0.72rem; font-weight: 600;">QUICK DEMO PRESETS</span>
        <div class="d-flex justify-content-center gap-1 mt-1">
          <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2 btn-demo-preset" data-email="researcher@nouriva.org" style="font-size: 0.72rem;">Researcher</button>
          <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2 btn-demo-preset" data-email="dietitian.sarah@nouriva.org" style="font-size: 0.72rem;">Dietitian</button>
          <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2 btn-demo-preset" data-email="trainee.marcus@gmail.com" style="font-size: 0.72rem;">Community</button>
        </div>
      </div>

      <form id="nourivaLoginForm">
        
        <!-- Input Field 1: Email (Separate Line) -->
        <div class="form-group mb-3">
          <label for="loginEmail" class="form-label">Email Address</label>
          <input type="email" class="form-control form-control-custom" id="loginEmail" placeholder="e.g. researcher@nouriva.org" value="researcher@nouriva.org" required>
        </div>

        <!-- Input Field 2: Password (Separate Line) -->
        <div class="form-group mb-3">
          <label for="loginPassword" class="form-label">Password</label>
          <div class="input-group">
            <input type="password" class="form-control form-control-custom" id="loginPassword" value="EvidenceRecovery2026!" required>
            <button class="btn btn-outline-secondary border-subtle btn-toggle-password" type="button" data-target="loginPassword">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <!-- Remember Me and Forgot Password in Same Line -->
        <div class="d-flex align-items-center justify-content-between mb-4" style="font-size: 0.84rem;">
          <label class="form-check mb-0">
            <input class="form-check-input" type="checkbox" checked>
            <span class="form-check-label text-secondary">Remember me</span>
          </label>
          <a href="forgot-password.html" class="text-accent text-decoration-none fw-medium">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-nour-primary w-100 justify-content-center py-2 mb-3">
          Sign In to NOURIVA
        </button>

        <div class="text-center my-3 position-relative">
          <hr class="border-subtle my-0">
          <span class="bg-surface px-2 text-muted small position-absolute top-50 start-50 translate-middle">or connect with</span>
        </div>

        <!-- Google and Apple Social Icons in Bottom -->
        <div class="social-auth-grid mb-3">
          <button type="button" class="social-auth-btn" onclick="if(window.NourivaBookmarks) NourivaBookmarks.showToast('Google authentication successful!', 'success'); setTimeout(() => window.location.href='index.html', 800);">
            <i class="bi bi-google text-danger fs-6"></i>
            <span>Google</span>
          </button>
          <button type="button" class="social-auth-btn" onclick="if(window.NourivaBookmarks) NourivaBookmarks.showToast('Apple ID authentication successful!', 'success'); setTimeout(() => window.location.href='index.html', 800);">
            <i class="bi bi-apple fs-6"></i>
            <span>Apple</span>
          </button>
        </div>

        <div class="text-center pt-2 border-top border-subtle">
          <span class="small text-muted">Don't have an account?</span>
          <a href="signup.html" class="small fw-bold text-accent ms-1">Create Account</a>
        </div>

      </form>

    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/bookmarks.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
