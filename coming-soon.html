<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon — NOURIVA</title>
  <meta name="description" content="Upcoming interactive metabolic calculators and personalized meal builder tools on the NOURIVA network.">
  <link rel="canonical" href="https://nouriva.org/coming-soon.html">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

  <!-- Primary Sticky Header -->
  <header class="nouriva-header">
    <div class="container-editorial">
      <div class="navbar-inner">
        <a href="index.html" class="brand-logo" aria-label="NOURIVA Homepage">
          <div class="brand-mark"><i class="bi bi-flower1"></i></div>
          <span>NOURIVA</span>
        </a>

        <div class="nav-actions-right ms-auto">
          <button class="theme-toggle-btn" aria-label="Toggle light and dark mode"><i class="bi bi-moon-stars"></i></button>
          <a href="index.html" class="btn btn-nour-primary btn-sm">Return Home</a>
        </div>
      </div>
    </div>
  </header>

  <!-- COMING SOON CONTENT -->
  <main class="auth-page-wrapper">
    <div class="auth-card text-center" style="max-width: 580px;">
      <span class="badge-nouriva badge-sage mb-3">In Development</span>
      <h1 class="hero-title mb-3" style="font-size: 2.8rem;">Interactive Recovery Calculators</h1>
      <p class="text-secondary mb-4" style="font-size: 1.05rem; line-height: 1.7;">
        Our editorial and biochemical team is building interactive client-side calculators for sweat-rate sodium replacement, leucine threshold calculations, and weekly batch meal builders.
      </p>

      <form id="notifyForm" class="mb-4" onsubmit="event.preventDefault(); if(window.NourivaBookmarks) NourivaBookmarks.showToast('You will be notified when this feature launches!', 'success'); this.reset();">
        <div class="input-group">
          <input type="email" class="form-control form-control-custom" placeholder="Enter your email for launch updates..." required>
          <button class="btn btn-nour-primary" type="submit">Notify Me</button>
        </div>
      </form>

      <div class="d-flex justify-content-center gap-2">
        <a href="explore.html" class="btn btn-nour-secondary btn-sm"><i class="bi bi-journal-text me-1"></i> Explore Knowledge Library</a>
        <a href="resources.html" class="btn btn-nour-secondary btn-sm"><i class="bi bi-download me-1"></i> View Printable Tools</a>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/bookmarks.js"></script>
