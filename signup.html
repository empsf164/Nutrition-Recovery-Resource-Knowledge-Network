<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Free Account — NOURIVA</title>
  <meta name="description" content="Join NOURIVA to personalize your nutrition and recovery knowledge feed, save templates, and participate in community discussions.">
  <link rel="canonical" href="https://nouriva.org/signup.html">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

  <!-- Floating Theme Toggle in Top Right Corner -->
  <div class="auth-floating-theme-btn">
    <button class="theme-toggle-btn shadow-sm" aria-label="Toggle light and dark mode">
      <i class="bi bi-moon-stars"></i>
    </button>
  </div>

  <!-- SIGNUP SECTION (No Navbar - Brand centered inside auth card) -->
  <main class="auth-page-wrapper">
    <div class="auth-card" style="max-width: 520px;">
      
      <!-- Brand Logo Centered Inside Box -->
      <a href="index.html" class="auth-brand-center" aria-label="Return to NOURIVA Homepage">
        <div class="brand-mark">
          <i class="bi bi-flower1"></i>
        </div>
        <span class="brand-name">NOURIVA</span>
      </a>

      <div class="auth-header text-center mb-4">
        <h2 class="font-editorial mb-1">Join NOURIVA Network</h2>
        <p class="text-secondary small mb-0">Create your free account to save tools, participate in discussions, and personalize your feed.</p>
      </div>

      <form id="nourivaSignupForm">
        
        <!-- Field 1: Full Name (Separate Line) -->
        <div class="form-group mb-3">
          <label for="signupName" class="form-label">Full Name <span class="text-danger">*</span></label>
          <input type="text" class="form-control form-control-custom" id="signupName" placeholder="e.g. Jordan Hayes" required>
        </div>

        <!-- Field 2: Email Address (Separate Line) -->
        <div class="form-group mb-3">
          <label for="signupEmail" class="form-label">Email Address <span class="text-danger">*</span></label>
          <input type="email" class="form-control form-control-custom" id="signupEmail" placeholder="e.g. jordan@example.com" required>
        </div>

        <!-- Field 3: Password (Separate Line) -->
        <div class="form-group mb-3">
          <label for="signupPassword" class="form-label">Password <span class="text-danger">*</span></label>
          <div class="input-group">
            <input type="password" class="form-control form-control-custom" id="signupPassword" placeholder="Min. 8 characters" required>
            <button class="btn btn-outline-secondary border-subtle btn-toggle-password" type="button" data-target="signupPassword">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <!-- Field 4: Confirm Password (Separate Line) -->
        <div class="form-group mb-3">
          <label for="signupConfirmPassword" class="form-label">Confirm Password <span class="text-danger">*</span></label>
          <div class="input-group">
            <input type="password" class="form-control form-control-custom" id="signupConfirmPassword" placeholder="Re-type password" required>
            <button class="btn btn-outline-secondary border-subtle btn-toggle-password" type="button" data-target="signupConfirmPassword">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <!-- Personalized Interest Selection -->
        <div class="form-group mb-4">
          <label class="form-label mb-1">Topics of Interest</label>
          <span class="d-block text-muted mb-2" style="font-size: 0.76rem;">Select topics to customize your recommended knowledge feed:</span>
          
          <div class="interest-chips-grid">
            <label class="interest-checkbox-label selected" data-interest="Nutrition Fundamentals">
              <input type="checkbox" checked>
              <i class="bi bi-check2"></i> Nutrition Basics
            </label>
            <label class="interest-checkbox-label selected" data-interest="Recovery Nutrition">
              <input type="checkbox" checked>
              <i class="bi bi-check2"></i> Recovery Science
            </label>
            <label class="interest-checkbox-label" data-interest="Hydration">
              <input type="checkbox">
              <i class="bi bi-plus"></i> Hydration & Salt
            </label>
            <label class="interest-checkbox-label" data-interest="Meal Planning">
              <input type="checkbox">
              <i class="bi bi-plus"></i> Meal Planning
            </label>
            <label class="interest-checkbox-label" data-interest="Protein & Energy">
              <input type="checkbox">
              <i class="bi bi-plus"></i> Protein & Energy
            </label>
            <label class="interest-checkbox-label" data-interest="Healthy Habits">
              <input type="checkbox">
              <i class="bi bi-plus"></i> Healthy Habits
            </label>
          </div>
        </div>

        <!-- Terms Agreement -->
        <div class="form-group mb-4">
          <label class="form-check" style="font-size: 0.82rem;">
            <input class="form-check-input" type="checkbox" id="signupTerms" checked required>
            <span class="form-check-label text-secondary">
              I acknowledge that NOURIVA provides educational resources and is not a substitute for professional medical or dietary evaluation.
            </span>
          </label>
        </div>

        <button type="submit" class="btn btn-nour-primary w-100 justify-content-center py-2 mb-3">
          Create Account & Personalize Feed
        </button>

        <div class="text-center my-3 position-relative">
          <hr class="border-subtle my-0">
          <span class="bg-surface px-2 text-muted small position-absolute top-50 start-50 translate-middle">or connect with</span>
        </div>

        <!-- Google and Apple Social Icons in Bottom -->
        <div class="social-auth-grid mb-3">
          <button type="button" class="social-auth-btn" onclick="if(window.NourivaBookmarks) NourivaBookmarks.showToast('Google Account linked successfully!', 'success'); setTimeout(() => window.location.href='index.html', 800);">
            <i class="bi bi-google text-danger fs-6"></i>
            <span>Google</span>
          </button>
          <button type="button" class="social-auth-btn" onclick="if(window.NourivaBookmarks) NourivaBookmarks.showToast('Apple ID linked successfully!', 'success'); setTimeout(() => window.location.href='index.html', 800);">
            <i class="bi bi-apple fs-6"></i>
            <span>Apple</span>
          </button>
        </div>

        <div class="text-center pt-2 border-top border-subtle">
          <span class="small text-muted">Already have an account?</span>
          <a href="login.html" class="small fw-bold text-accent ms-1">Sign In</a>
        </div>

      </form>

    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/bookmarks.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
